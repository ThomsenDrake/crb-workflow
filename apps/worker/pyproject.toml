[project]
name = "ncaa-d1-best-line-worker"
version = "0.1.0"
description = "Mistral Workflows worker for the NCAA D1 best-line finder (spread / moneyline / over-under line shopping, edge/EV, fractional Kelly)"
requires-python = ">=3.12"
dependencies = [
    "mistralai>=1.9.0",
    "pydantic>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]
